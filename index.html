<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>出ㄎㄧˋ勝高雄、台南遊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="媽媽南下高雄的四天三夜行程：橋頭糖廠、泡湯、台南一日遊、鹽埕吃一輪。">
<meta name="theme-color" content="#f5f8f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11201f" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 版面：港都潮汐，一條直的時間軸沿著海岸線往下走，每天一段 */
/* ========== 1. 顏色（淺色／深色） ========== */
:root{
  --bg:#f5f8f8; --surface:#ffffff; --fg:#1d3137; --muted:#5f7479; --line:#d6e2e3;
  --sea:#2a7f8f; --sea-soft:#e2f0f1; --sun:#e08a4b; --sun-soft:#fbeee3;
  --veil:rgba(245,248,248,.62);
  --shadow:0 1px 2px rgba(29,49,55,.05),0 10px 28px rgba(29,49,55,.07);
  --f-title:"LXGW WenKai TC","PingFang TC","Microsoft JhengHei","Noto Serif TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"PingFang TC","Microsoft JhengHei",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11201f; --surface:#182b2c; --fg:#e4eeee; --muted:#9db2b3; --line:#2a4142;
    --sea:#6cc3cf; --sea-soft:#1d3a3d; --sun:#f0a571; --sun-soft:#3a2a20;
    --veil:rgba(17,32,31,.62);
    --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11201f; --surface:#182b2c; --fg:#e4eeee; --muted:#9db2b3; --line:#2a4142;
  --sea:#6cc3cf; --sea-soft:#1d3a3d; --sun:#f0a571; --sun-soft:#3a2a20;
  --veil:rgba(17,32,31,.62);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.25);
  color-scheme:dark;
}

/* ========== 2. 基本 ========== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.7;overflow-x:hidden}
a{color:var(--sea)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--sun);outline-offset:3px;border-radius:8px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* ========== 3. 標題區 ========== */
.hero{position:relative;padding-top:44px;padding-bottom:56px;overflow:hidden}
.eyebrow{margin:0 0 6px;font-family:var(--f-mono);font-size:13px;letter-spacing:.18em;color:var(--muted)}
.hero h1{margin:0;font-family:var(--f-title);font-weight:700;font-size:clamp(44px,13vw,72px);line-height:1.12;letter-spacing:.02em;text-wrap:balance}
.hero h1 .k{color:var(--sun)}
.hero h1 .s{color:var(--sea)}
.sub{margin:14px 0 0;color:var(--muted);font-size:16px;max-width:34em}
.tip{display:inline-flex;align-items:center;gap:8px;margin:14px 0 0;padding:6px 12px;border-radius:999px;background:var(--sun-soft);color:var(--fg);font-size:14px}
.tip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sun);flex:none}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px 0 0;padding:0}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-family:var(--f-mono);font-size:15px;font-weight:500;line-height:1.35}
.facts dd.cd{color:var(--sun)}
.hero-wave{position:absolute;left:0;right:0;bottom:6px;height:26px;overflow:hidden;pointer-events:none}
.hero-wave svg{width:200%;height:26px;display:block;animation:drift 14s ease-in-out infinite alternate}
.hero-wave path{fill:none;stroke:var(--sea);stroke-width:2;stroke-linecap:round;opacity:.55}
.hero-wave path + path{stroke:var(--sun);opacity:.35}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ========== 4. 黏在上方的日期列 ========== */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:30;background:var(--bg)}
.daynav{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.daynav .wrap{display:flex;gap:8px;padding-top:10px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none}
.daynav .wrap::-webkit-scrollbar{display:none}
.daybtn{flex:1 1 0;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 4px;font-family:var(--f-mono);font-size:13px;cursor:pointer;white-space:nowrap;transition:background .25s,color .25s,border-color .25s}
.daybtn b{font-weight:500}
.daybtn span{margin-left:3px;font-family:var(--f-body);font-size:12px}
.daybtn[aria-current="true"]{background:var(--sea);border-color:var(--sea);color:var(--bg)}

/* ========== 5. 提醒框 ========== */
.remind{display:flex;gap:12px;align-items:flex-start;margin:22px 0 4px;padding:14px 16px;border-radius:16px;background:var(--sun-soft);border:1px solid color-mix(in srgb,var(--sun) 35%,transparent)}
.pulse{position:relative;flex:none;width:10px;height:10px;margin-top:8px;border-radius:50%;background:var(--sun)}
.pulse::after{content:"";position:absolute;inset:-6px;border-radius:50%;background:var(--sun);opacity:.35;animation:breathe 2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.6);opacity:.45}50%{transform:scale(1.4);opacity:0}}
.remind strong{display:block;font-weight:700}
.remind small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:13px}

/* ========== 6. 每一天 ========== */
.day{padding-top:38px;scroll-margin-top:60px}
.day-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.day-date{font-family:var(--f-mono);font-size:40px;font-weight:500;line-height:1;color:var(--sea);letter-spacing:-.02em}
.day-title{margin:0;font-family:var(--f-title);font-size:24px;font-weight:700;line-height:1.3;text-wrap:balance}
.day-dow{font-family:var(--f-mono);font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 9px}

/* 今天怎麼排 */
.plan{margin:14px 0 0;padding:12px 14px 12px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sea)}
.plan-title{margin:0 0 4px;font-size:14px;font-weight:700;color:var(--sea)}
.plan ul{margin:0;padding-left:18px;font-size:14px}
.plan li{margin:2px 0}
.plan li::marker{color:var(--sea)}

/* 攜帶清單 */
.pack{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--sea-soft)}
.pack-title{margin:0 0 6px;font-size:13px;color:var(--muted)}
.pack ul{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.pack-item{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 8px;cursor:pointer;font-size:14px;transition:opacity .2s}
.pack-item .box{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--sea);display:grid;place-items:center;flex:none;transition:background .2s}
.pack-item .box svg{width:12px;height:12px;stroke:var(--bg);stroke-width:2.6;fill:none;opacity:0;transition:opacity .2s}
.pack-item[aria-pressed="true"]{opacity:.62}
.pack-item[aria-pressed="true"] .label{text-decoration:line-through;text-decoration-thickness:1.5px}
.pack-item[aria-pressed="true"] .box{background:var(--sea)}
.pack-item[aria-pressed="true"] .box svg{opacity:1}

/* 時間軸 */
.tl{position:relative;list-style:none;margin:22px 0 0;padding:0 0 0 30px}
.tl::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.stop{position:relative;margin:0 0 6px}
.stop::before{content:"";position:absolute;left:-27px;top:26px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--sea);box-shadow:0 0 0 4px var(--bg)}
.stop.meal::before{border-color:var(--sun)}
.stop.opt::before{border-style:dashed}
.card{position:relative;margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.stop.skip{opacity:.42;filter:grayscale(.6)}
.stop.skip .card{box-shadow:none;border-style:dashed}
.stop.opt .card{border-style:dashed;border-width:1.5px;box-shadow:none}
.card-head{padding-right:62px}
.card.noillo .card-head{padding-right:0}
.time{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.stop.meal .time{color:var(--sun)}
.badge{font-family:var(--f-body);font-size:12px;padding:0 8px;border-radius:999px;border:1px dashed var(--sea);color:var(--sea);line-height:1.6}
.badge.add{border-style:solid;background:var(--sea-soft);border-color:transparent}
.name{margin:2px 0 0;font-family:var(--f-title);font-size:22px;font-weight:700;line-height:1.35;text-wrap:balance}
.desc{margin:8px 0 0;color:var(--fg)}

/* 地址（點了直接開 Google 地圖導航）與時間 */
.addr{display:flex;align-items:flex-start;gap:8px;margin:10px 0 0;padding:8px 10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14px;color:var(--fg);text-decoration:none;transition:border-color .2s,background .2s}
.addr:hover{border-color:var(--sea)}
.addr .lbl,.hours .lbl{flex:none;font-size:12px;padding:1px 8px;border-radius:6px;background:var(--sea-soft);color:var(--sea);margin-top:1px}
.addr .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.addr .nav{flex:none;align-self:center;font-size:13px;font-weight:500;color:var(--sea);white-space:nowrap}
.hours{display:flex;align-items:flex-start;gap:8px;margin:8px 0 0;font-size:14px;color:var(--muted)}
.hours .lbl{background:var(--sun-soft);color:var(--sun)}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.tags li{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--sea-soft);color:var(--sea)}
.note{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--sun-soft);font-size:14px}
.note b{color:var(--sun);margin-right:6px}
.note.warn{border:1.5px solid var(--sun)}

/* 必吃 */
.must{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:12px 0 0}
.must-label{font-size:12px;color:var(--sun);font-weight:700;margin-right:2px}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;border:1.5px solid var(--sun);background:var(--sun-soft)}
.chip.maybe{border-style:dashed;background:transparent;color:var(--muted)}

/* 高鐵路線 */
.hsr{display:flex;align-items:center;gap:10px;margin:12px 0 0;padding:12px 14px;border-radius:14px;background:var(--sea-soft)}
.hsr .st{display:flex;flex-direction:column;line-height:1.25;flex:none}
.hsr .st b{font-family:var(--f-mono);font-size:20px;font-weight:500;color:var(--sea)}
.hsr .st span{font-size:13px;color:var(--muted)}
.hsr .track{flex:1;display:flex;align-items:center;min-width:24px}
.hsr .dash{flex:1;border-top:2px dashed var(--sea);opacity:.7}
.hsr .track svg{width:12px;height:12px;flex:none;fill:var(--sea)}

/* 地圖按鈕 */
.maplink{display:inline-flex;align-items:center;max-width:100%;margin:12px 0 0;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--fg);background:var(--bg);font-size:14px;overflow:hidden;transition:border-color .2s}
.maplink:hover{border-color:var(--sea)}
.maplink .pl{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;min-width:0}
.maplink .pl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.maplink svg{width:16px;height:16px;flex:none;fill:var(--sun)}
.maplink .go{padding:6px 12px;background:var(--sea);color:var(--bg);font-weight:500;white-space:nowrap}

/* 大家怎麼說 */
.rev{margin:12px 0 0;border-top:1px dashed var(--line);padding-top:6px}
.rev-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 2px;border:0;background:none;cursor:pointer;text-align:left;font-size:15px;font-weight:500}
.rev-btn .rating{font-family:var(--f-mono);font-size:13px;color:var(--sun);font-weight:500}
.rev-btn .chev{margin-left:auto;width:18px;height:18px;stroke:var(--muted);stroke-width:2;fill:none;transition:transform .3s}
.rev-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.rev-panel{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .35s ease,visibility 0s linear .35s}
.rev-panel.open{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .35s ease,visibility 0s}
.rev-inner{overflow:hidden}
.rev ul{margin:2px 0 0;padding-left:20px;font-size:14px;color:var(--fg)}
.rev li{margin:3px 0}
.rev li::marker{color:var(--sea)}
.rev-links{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0 6px;font-size:13px}

/* 右上角插圖按鈕 */
.illo{position:absolute;top:-20px;right:-6px;width:64px;height:64px;padding:0;border:0;background:none;cursor:pointer;transform:rotate(6deg);transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s;border-radius:16px}
.illo svg{width:64px;height:64px;display:block;overflow:visible}
.illo .play{position:absolute;right:-2px;bottom:0;width:20px;height:20px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 3px var(--surface)}
.illo .play::after{content:"";position:absolute;left:8px;top:6px;border-left:6px solid var(--surface);border-top:4px solid transparent;border-bottom:4px solid transparent}
@media (hover:hover){ .stop .card:hover .illo{transform:rotate(0deg) translateY(-4px)} }
.illo:focus-visible{outline-offset:2px}

/* 交通列 */
.move{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin:14px 0 -4px;font-size:13px;color:var(--muted)}
.move .ico{width:28px;height:28px;margin-left:-35px;border-radius:50%;display:grid;place-items:center;background:var(--bg);flex:none}
.move .ico svg{width:20px;height:20px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.move.ride .ico svg{stroke:var(--sea)}
.move.walk .ico svg{stroke:var(--sun)}
.move.walk .mode{color:var(--sun)}
.move.ride .mode{color:var(--sea)}
.move .mode{font-weight:500}
.move a{color:var(--muted);text-underline-offset:3px}
.move a:hover{color:var(--sea)}
.move.home{margin-top:18px}

/* 備選清單 */
.alts{margin:30px 0 0;padding:16px;border-radius:18px;background:var(--sea-soft)}
.alts-title{margin:0;font-family:var(--f-title);font-size:20px;font-weight:700}
.alts-sub{margin:2px 0 0;font-size:14px;color:var(--muted)}
.alt-filter{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.alt-filter button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer}
.alt-filter button[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--bg)}
.alt-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin:12px 0 0;padding:0;list-style:none}
.alt{display:flex;flex-direction:column;gap:6px;min-width:0;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.alt[hidden]{display:none}
.alt-name{margin:0;font-weight:700;font-size:16px;line-height:1.4}
.alt-tags{display:flex;flex-wrap:wrap;gap:4px}
.alt-tags span{font-size:11.5px;padding:0 8px;border-radius:999px;background:var(--sea-soft);color:var(--sea);line-height:1.7}
.alt-tags span.hot{background:var(--sun-soft);color:var(--sun)}
.alt p{margin:0;font-size:13.5px}
.alt .why b,.alt .con b{font-weight:500;margin-right:4px}
.alt .why b{color:var(--sea)}
.alt .con b{color:var(--sun)}
.alt .hrs{color:var(--muted);font-family:var(--f-mono);font-size:12.5px}
.alt .addr{margin:auto 0 0;padding:6px 8px;font-size:13px}

/* 頁尾 */
.foot{text-align:center;padding:56px 0 48px;color:var(--muted)}
.foot p{margin:0;font-family:var(--f-title);font-size:20px;color:var(--fg)}
.foot small{font-family:var(--f-mono);font-size:12px}

/* ========== 7. 捲動進場動畫 ========== */
.pre{opacity:0;transform:translateY(28px)}
.pre .illo{opacity:0;transform:rotate(-12deg) translateY(14px)}
.reveal-on{transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}

/* ========== 8. 點插圖後的全螢幕動畫 ========== */
.ov{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));background:var(--veil);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;transition:opacity .28s ease;cursor:pointer}
.ov[hidden]{display:none}
.ov.show{opacity:1}
.ov:focus{outline:none}
.stage{width:min(92vw,460px)}
.stage svg{width:100%;height:auto;max-height:72vh;display:block;overflow:visible}
.ov.show .stage{animation:zoomIn .4s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes zoomIn{from{transform:scale(.82);opacity:0}to{transform:none;opacity:1}}
.ov-bar{width:120px;height:4px;border-radius:4px;background:color-mix(in srgb,var(--sun) 22%,transparent);overflow:hidden}
.ov-bar span{display:block;height:100%;background:var(--sun);border-radius:4px;transform-origin:left center}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.ov-hint{margin:0;font-size:13px;color:var(--muted)}

/* ---- SVG 共用樣式（全部用 CSS 變數，深淺色都好看） ---- */
.ic{fill:none;stroke:var(--sea);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.f-surf{fill:var(--surface)} .f-seasoft{fill:var(--sea-soft)} .f-sunsoft{fill:var(--sun-soft)}
.f-sun{fill:var(--sun)} .f-sea{fill:var(--sea)} .f-fg{fill:var(--fg);stroke:none} .f-bg{fill:var(--bg)}
.st-sun{stroke:var(--sun)} .st-line{stroke:var(--line)} .st-muted{stroke:var(--muted)}
.no-st{stroke:none}
.t{font-family:var(--f-title);fill:var(--fg);stroke:none;font-weight:700}
.tm{font-family:var(--f-mono);fill:var(--muted);stroke:none;font-weight:500}

/* 動畫積木 */
.ap{animation:fadeIn .45s ease var(--d,0s) both}
.pop{transform-box:fill-box;transform-origin:center bottom;animation:pop .5s cubic-bezier(.3,1.6,.5,1) var(--d,0s) both}
.drop{animation:drop .75s cubic-bezier(.3,.8,.4,1) var(--d,0s) both}
.mvx{animation:moveX var(--t,3s) linear var(--d,0s) both}
.slide{animation:moveX var(--t,.7s) cubic-bezier(.2,.8,.2,1) var(--d,0s) both}
.walk{animation:bob .32s ease-in-out infinite alternate}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1.4s) ease-in-out var(--d,0s) both}
.steam{animation:steam 1.8s ease-in-out var(--d,0s) infinite both}
.flow{animation:flow var(--t,2.4s) linear infinite}
.lantern{fill:var(--sea-soft);animation:lightUp .4s ease var(--d,0s) both}
.swing{transform-box:view-box;animation:swing 1.1s ease-in-out infinite alternate}
.neck{transform-box:view-box;transform-origin:172px 154px;animation:neck 1.6s ease-in-out infinite alternate}
.toss{transform-box:fill-box;transform-origin:center;animation:toss 1.3s cubic-bezier(.3,.6,.4,1) var(--d,2.6s) both}

function countdown(){
  const el = document.getElementById("countdown"), now = new Date();
  if (now >= TRIP_END){ el.textContent = "旅程結束"; return; }
  if (now >= DEPART){ el.textContent = "旅程進行中"; return; }
  const tw = new Date(now.getTime() + 8 * 3600e3);

function setupNav(){
  const nav = document.getElementById("daynav");
  const btns = [...nav.querySelectorAll(".daybtn")];
  nav.addEventListener("click", e => {
    const b = e.target.closest(".daybtn"); if (!b) return;
    document.getElementById(b.dataset.target).scrollIntoView({ behavior: reduceMotion.matches ? "auto" : "smooth", block: "start" });
  });
  let ticking = false;
  const update = () => {
    ticking = false;
    const line = document.querySelector(".daynav").offsetHeight + 80;
    let cur = null;
    TRIP.forEach(d => { if (document.getElementById(d.id).getBoundingClientRect().top <= line) cur = d.id; });
    btns.forEach(b => b.setAttribute("aria-current", String(b.dataset.target === cur)));
  };
  window.addEventListener("scroll", () => { if (!ticking){ ticking = true; requestAnimationFrame(update); } }, { passive: true });
  update();
}
function setupClicks(){
  document.getElementById("days").addEventListener("click", e => {
    const p = e.target.closest(".pack-item");
    if (p){ const on = p.getAttribute("aria-pressed") !== "true"; p.setAttribute("aria-pressed", String(on)); store.set(p.dataset.key, on ? "1" : "0"); return; }
    const r = e.target.closest(".rev-btn");
    if (r){ const open = r.getAttribute("aria-expanded") !== "true"; r.setAttribute("aria-expanded", String(open)); document.getElementById(r.getAttribute("aria-controls")).classList.toggle("open", open); return; }
    const f = e.target.closest(".alt-filter button");
    if (f){
      const box = f.closest(".alts"), tag = f.dataset.tag;
      box.querySelectorAll(".alt-filter button").forEach(b => b.setAttribute("aria-pressed", String(b === f)));
      box.querySelectorAll(".alt").forEach(li => { li.hidden = !!tag && !li.dataset.tags.split(",").includes(tag); });
      return;
    }
    const il = e.target.closest(".illo");
    if (il) openAnim(il);
  });
}
function setupReveal(){
  if (reduceMotion.matches || !("IntersectionObserver" in window)) return;
  const els = [...document.querySelectorAll(".reveal")];
  const vh = window.innerHeight;
  const later = els.filter(el => el.getBoundingClientRect().top > vh - 10);
  later.forEach(el => el.classList.add("pre"));
  requestAnimationFrame(() => later.forEach(el => el.classList.add("reveal-on")));
  const io = new IntersectionObserver(entries => {
    let n = 0;
    entries.filter(en => en.isIntersecting).forEach(en => {
      en.target.style.transitionDelay = `${n++ * 70}ms`;
      en.target.classList.remove("pre");
      io.unobserve(en.target);
    });
  }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
  later.forEach(el => io.observe(el));
}

const TW = [[121.54,25.30],[121.75,25.15],[121.99,25.01],[121.85,24.85],[121.83,24.60],[121.75,24.30],[121.62,23.98],[121.50,23.50],[121.38,23.10],[121.15,22.75],[120.90,22.35],[120.85,21.90],[120.73,21.93],[120.69,22.20],[120.59,22.37],[120.45,22.46],[120.26,22.62],[120.15,23.00],[120.08,23.10],[120.13,23.45],[120.15,23.70],[120.38,24.10],[120.50,24.28],[120.70,24.55],[120.92,24.82],[121.10,25.05],[121.40,25.18]];
const HSR = [[121.464,25.014],[121.215,25.013],[121.040,24.808],[120.826,24.605],[120.616,24.112],[120.574,23.874],[120.416,23.736],[120.323,23.459],[120.286,22.925],[120.307,22.687]];
const proj = ([lon, lat]) => [100 + (lon - 120.0) * 0.917 * 76, 14 + (25.35 - lat) * 76];
function smooth(pts, closed){
  const P = pts.map(proj), n = P.length, f = v => v.toFixed(1);
  const at = i => closed ? P[(i + n) % n] : P[Math.max(0, Math.min(n - 1, i))];
  let d = `M${f(P[0][0])} ${f(P[0][1])}`;
  const segs = closed ? n : n - 1;
  for (let i = 0; i < segs; i++){
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${f(c1[0])} ${f(c1[1])} ${f(c2[0])} ${f(c2[1])} ${f(p2[0])} ${f(p2[1])}`;
  }
  return d + (closed ? "Z" : "");
}

/* 開／關動畫 */
const ov = document.getElementById("ov"), stage = document.getElementById("stage"), bar = document.getElementById("ovbar");
let lastBtn = null, timer = 0, closing = 0;
function openAnim(btn){
  const make = ANIMS[btn.dataset.anim]; if (!make) return;
  clearTimeout(timer); clearTimeout(closing);
  lastBtn = btn;
  const [dur, svg] = make(btn.dataset.say);
  const total = reduceMotion.matches ? 2.5 : dur + 1.2;
  stage.innerHTML = svg;
  const s = stage.querySelector("svg");
  try {
    if (reduceMotion.matches){ s.setCurrentTime(dur); s.pauseAnimations(); }
    else s.setCurrentTime(0);
  } catch(e){}
  ov.setAttribute("aria-label", btn.getAttribute("aria-label").replace("播放小動畫：", "小動畫："));
  bar.style.animation = "none"; void bar.offsetWidth;
  bar.style.animation = `shrink ${total}s linear forwards`;
  ov.hidden = false;
  requestAnimationFrame(() => ov.classList.add("show"));
  ov.focus({ preventScroll: true });
  timer = setTimeout(closeAnim, total * 1000);
}
function closeAnim(){
  if (ov.hidden) return;
  clearTimeout(timer);
  ov.classList.remove("show");
  closing = setTimeout(() => { ov.hidden = true; stage.innerHTML = ""; }, 280);
  if (lastBtn) lastBtn.focus({ preventScroll: true });
}
ov.addEventListener("click", closeAnim);
document.addEventListener("keydown", e => {
  if (ov.hidden) return;
  if (e.key === "Escape" || e.key === "Tab"){ e.preventDefault(); closeAnim(); }
});

/* =========================================================
   七、啟動

render();
